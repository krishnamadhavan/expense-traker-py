name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-use-only-in-github-actions
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/local.txt
            backend/requirements/production.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/local.txt

      - name: Django system check
        run: python manage.py check --deploy
        env:
          # --deploy uses production-oriented checks; use production module
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-production-check-secret-key-long-enough-for-django-w009
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          DJANGO_SECURE_SSL_REDIRECT: "true"

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Smoke-test health endpoints
        run: |
          python manage.py shell -c "
          from django.test import Client
          c = Client()
          for path in ['/health/', '/ready/']:
              r = c.get(path)
              assert r.status_code == 200, (path, r.status_code, r.content)
              print(path, r.status_code, r.json())
          "
