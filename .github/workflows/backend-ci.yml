name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: expense_tracker
          POSTGRES_USER: expense_tracker
          POSTGRES_PASSWORD: expense_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_tracker -d expense_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-use-only-in-github-actions
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense_tracker
      POSTGRES_PASSWORD: expense_tracker

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/local.txt
            backend/requirements/production.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/local.txt

      - name: Run pre-commit
        working-directory: .
        run: pre-commit run --all-files

      - name: Django system check
        run: python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-production-check-secret-key-long-enough-for-django-w009
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          DJANGO_SECURE_SSL_REDIRECT: "true"

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Smoke-test health endpoints
        run: |
          python manage.py shell -c "
          from django.test import Client
          c = Client()
          for path in ['/health/', '/ready/']:
              r = c.get(path)
              assert r.status_code == 200, (path, r.status_code, r.content)
              print(path, r.status_code, r.json())
          "
